<script>

const BASES=[
 {id:'dagger',name:'灰鉄の短剣',slot:'weapon',atk:7,def:0,hp:0,crit:14,skill:'影縫い',desc:'先手の2連撃。各打撃80%威力・防御を1無視。会心を2回狙える。'},

 {id:'knight',name:'空鎧の番兵',hp:39,atk:12,def:5,xp:15,shape:'knight',desc:'鎧の内側は空洞だ。防御を崩すか、構えの切れ目を狙う。',moves:['guard','heavy','open']},
 {id:'moth',name:'灯喰いの蛾',hp:29,atk:11,def:0,xp:12,shape:'moth',desc:'灯りに集う不吉な翅。細かな連撃は防具で抑えやすい。',moves:['double','attack','heavy']},

 {id:'warden',name:'鐘底の監守',hp:86,atk:16,def:4,xp:30,shape:'knight',desc:'鐘のない鐘楼を守るもの。力を溜めた次の一撃に備えよ。',moves:['attack','guard','heavy','open']}
];
const MOVES={attack:{name:'斬撃',hint:'通常の攻撃',mult:1},heavy:{name:'大振り',hint:'強い一撃。防御が有効',mult:1.8},guard:{name:'構え',hint:'攻撃せず、このターン被ダメージ半減',mult:0},open:{name:'隙',hint:'攻撃しない。こちらの与ダメージ +30%',mult:0},double:{name:'連撃',hint:'小さな攻撃を2回',mult:.6},drain:{name:'吸命',hint:'攻撃し、与ダメージ分回復',mult:.8}};
const SLOTS={weapon:'武器',armor:'防具',charm:'装飾品'}, RARITIES=['通常','魔法','希少'];
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[ri(0,a.length-1)], clamp=(x,a,b)=>Math.min(b,Math.max(a,x));
let counter=0;const uid=()=>Date.now().toString(36)+'-'+(++counter)+'-'+Math.random().toString(36).slice(2,9);
function base(item){return BASES.find(b=>b.id===item.base)}
function makeItem(tier=1,rare=null,baseId=null){const b=baseId?BASES.find(x=>x.id===baseId):pick(BASES),r=rare===null?(Math.random()<.12?2:Math.random()<.44?1:0):rare,q=ri(85,115),scale=(1+(tier-1)*.24)*(1+r*.09)*q/100;let pool=AFFIXES.filter(a=>a.slots.includes(b.slot));let aff=[];for(let i=0;i<r;i++){const a=pick(pool);aff.push(a.id);pool=pool.filter(x=>x.id!==a.id)}return {id:uid(),base:b.id,tier,rarity:r,quality:q,atk:b.atk?Math.max(1,Math.round(b.atk*scale)):0,def:b.def?Math.max(1,Math.round(b.def*scale)):0,hp:b.hp?Math.round(b.hp*scale):0,crit:b.crit,aff,locked:false}}
function initial(){const sword=makeItem(1,0,'sword'),coat=makeItem(1,0,'leather');Object.assign(sword,{atk:10,quality:100});Object.assign(coat,{def:2,hp:7,quality:100});return {version:VERSION,level:1,xp:0,unlocked:1,selectedRank:1,inventory:[sword,coat],equipped:{weapon:sword.id,armor:coat.id,charm:null},run:null,history:[],stats:{kills:0,returns:0,bosses:0},last:'灯守の拠点へようこそ。装備を持ち帰り、自分の一振りを見つけよう。'}}
let storageIssue='', state,tab='play',filter='all',page=0,bagView='stored',toastTimer;
function itemValid(i){return i&&typeof i.id==='string'&&/^[a-z0-9-]{1,100}$/i.test(i.id)&&BASES.some(b=>b.id===i.base)&&Number.isInteger(i.tier)&&i.tier>=1&&i.tier<=3&&Number.isInteger(i.rarity)&&i.rarity>=0&&i.rarity<=2&&['atk','def','hp','crit','quality'].every(k=>Number.isFinite(i[k])&&i[k]>=0&&i[k]<=200)&&typeof i.locked==='boolean'&&Array.isArray(i.aff)&&i.aff.length===i.rarity&&new Set(i.aff).size===i.aff.length&&i.aff.every(a=>AFFIXES.some(f=>f.id===a&&f.slots.includes(base(i).slot)))}
function valid(s){if(!s||s.version!==VERSION||!Number.isInteger(s.level)||s.level<1||s.level>999||!Number.isFinite(s.xp)||s.xp<0||!Number.isInteger(s.unlocked)||s.unlocked<1||s.unlocked>3||!Number.isInteger(s.selectedRank)||s.selectedRank<1||s.selectedRank>s.unlocked||!Array.isArray(s.inventory)||!s.inventory.length||s.inventory.length>10000||!s.inventory.every(itemValid)||new Set(s.inventory.map(i=>i.id)).size!==s.inventory.length||!s.equipped||!s.stats||!['kills','returns','bosses'].every(k=>Number.isFinite(s.stats[k])&&s.stats[k]>=0)||typeof s.last!=='string'||s.last.length>2000||!Array.isArray(s.history)||s.history.length>50||!s.history.every(x=>typeof x==='string'&&x.length<1000))return false;for(const sl of Object.keys(SLOTS)){if(s.equipped[sl]!==null&&!s.inventory.some(i=>i.id===s.equipped[sl]&&base(i).slot===sl))return false}if(!s.equipped.weapon||!s.equipped.armor)return false;const r=s.run;if(!r)return r===null;if(!Number.isInteger(r.rank)||r.rank<1||r.rank>s.unlocked||!Number.isInteger(r.room)||r.room<0||r.room>6||!['path','battle','loot','cleared'].includes(r.phase)||!Number.isFinite(r.hp)||r.hp<=0||r.hp>10000||!Number.isInteger(r.focus)||r.focus<0||r.focus>3||!Number.isInteger(r.potions)||r.potions<0||r.potions>3||!Array.isArray(r.loot)||!r.loot.every(itemValid)||new Set([...r.loot,...s.inventory].map(i=>i.id)).size!==r.loot.length+s.inventory.length||!Array.isArray(r.logs)||r.logs.length>30||!r.logs.every(x=>typeof x==='string'&&x.length<1000)||typeof r.event!=='string'||r.event.length>2000||!Array.isArray(r.latest)||!r.latest.every(id=>r.loot.some(i=>i.id===id))||!Number.isInteger(r.turn)||r.turn<0||typeof r.first!=='boolean'||!Number.isInteger(r.broken)||r.broken<0||r.broken>3||!Array.isArray(r.choices)||r.choices.length>2||!r.choices.every(x=>['hunt','cache','rest','elite'].includes(x)))return false;if(r.phase==='battle'){let e=r.enemy;if(!e||!ENEMIES.some(x=>x.id===e.id)||!['hp','max','atk','def','xp'].every(k=>Number.isFinite(e[k])&&e[k]>=0&&e[k]<10000)||e.hp<=0||e.hp>e.max||typeof e.elite!=='boolean')return false;}return true}
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!valid(parsed))throw Error('invalid');state=parsed}else state=initial()}catch(e){state=initial();storageIssue='保存データを読み込めませんでした。元データ保護のため自動保存を停止しています。「記録」からバックアップを読み込むか、保存を再開してください。'}
function save(){if(storageIssue)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageIssue='この環境では自動保存できません。「記録」からセーブを書き出してください。'}}
function equipped(sl){return state.inventory.find(i=>i.id===state.equipped[sl])}
function buildStats(replacement=null){let out={atk:3+state.level-1,def:0,hp:64+(state.level-1)*6,crit:3,aff:{}};for(const sl of Object.keys(SLOTS)){const i=replacement&&base(replacement).slot===sl?replacement:equipped(sl);if(!i)continue;for(const k of ['atk','def','hp','crit'])out[k]+=i[k];for(const a of i.aff)out.aff[a]=(out.aff[a]||0)+1}out.crit=Math.min(70,out.crit+10*(out.aff.keen||0));out.hp+=12*(out.aff.vital||0);return out}
function notify(t){$('#toast').textContent=t;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2800)}
function log(t){state.run.logs.unshift(t);state.run.logs=state.run.logs.slice(0,24)}
function commit(){save();render()}
function icon(type){let paths={weapon:'<path d="m7 25 5-5m-3-3 6 6m-3-6L23 4l4 1-1 4-12 11M5 27l3-3"/>',armor:'<path d="m10 4 6 3 6-3 7 7-5 5-2-3v15H10V13l-2 3-5-5z"/>',charm:'<circle cx="16" cy="19" r="9"/><path d="m11 7 5-5 5 5-5 5zM9 20a7 7 0 0 0 7 6"/>'};return '<span class="icon"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true">'+paths[type]+'</svg></span>'}
function scene(enemy=null){const fig=enemy?enemy.shape:null;let glyph=fig==='beast'?'<path d="m199 128 14-36 27 11 23-11 31 16 18 25-27-7-18 12-22-3-23-3z" fill="#68715a"/><path d="m214 97-7-19 22 14m47 10 18-18-3 28" fill="#78816a"/><path d="m225 111 7 1m41-3 7-2" stroke="#edb882" stroke-width="3"/>':fig==='moth'?'<path d="M253 102Q183 35 178 94q8 55 73 30-47 58-63 5m66-27q70-67 75-8-8 55-73 30 47 58 63 5" fill="#687061" stroke="#939271"/><path d="m254 74 0 64m0-64-11-13m11 13 11-13" stroke="#d2b873" stroke-width="3"/>':fig?'<path d="m224 145 12-61 17-12 18 12 15 61z" fill="#424e43" stroke="#8b906f"/><path d="m239 78-5-26 19-14 19 14-5 26-14 8z" fill="#313e34" stroke="#959271"/><path d="m243 60 9 3m5 0 8-3" stroke="#dfba78" stroke-width="2"/><path d="m227 96-14 31m67-31 14 31m-2-47 0 73" stroke="#7e856b" stroke-width="5"/>':'';return '<div class="scene"><svg viewBox="0 0 510 165" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="glow"><stop stop-color="#dfc98a" stop-opacity=".2"/><stop offset="1" stop-color="#dfc98a" stop-opacity="0"/></radialGradient></defs><path d="M0 0 159 35v130H0m510-165L351 35v130h159" fill="#1d2920"/><path d="M50 0 185 44v121M460 0 325 44v121M115 0 215 52v113M395 0 295 52v113M0 138l215-34h80l215 34M0 53l215 23h80l215-23M0 92l215 2h80l215-2" fill="none" stroke="#425040" stroke-opacity=".65"/><path d="M218 153V63q36-44 74 0v90" fill="#0a100d" stroke="#657157"/><ellipse cx="255" cy="118" rx="120" ry="70" fill="url(#glow)"/><path d="M163 76v30m184-30v30" stroke="#6b6847" stroke-width="5"/><path d="M163 69q-9-13 1-22 9 13-1 22m184 0q-9-13 1-22 9 13-1 22" fill="#d6b76b"/>'+glyph+'</svg><span class="scene-label">'+(enemy?'THE FORGOTTEN BELOW':'灰の底に、まだ灯りがある。')+'</span></div>'}
function itemName(i){return base(i).name+(i.rarity?'〈'+i.aff.map(a=>AFFIXES.find(x=>x.id===a).name).join('・')+'〉':'')}
function statsLine(i){return [['atk','攻'],['def','防'],['hp','HP'],['crit','会心']].filter(([k])=>i[k]).map(([k,n])=>n+' '+i[k]+(k==='crit'?'%':'')).join(' / ')}
function card(i,extra=''){return '<button class="item" data-item="'+i.id+'"><div class="item-title">'+icon(base(i).slot)+'<div><div class="item-name r'+i.rarity+'">'+esc(itemName(i))+'</div><div class="item-meta">'+SLOTS[base(i).slot]+' · '+RARITIES[i.rarity]+' · 深度 '+i.tier+(i.locked?' · 保護':'')+extra+'</div></div></div><div class="affix-line">'+statsLine(i)+'</div></button>'}
function equipmentPanel(){return '<div class="panel pad"><div class="section-title"><h3>現在の装備</h3><span class="badge">'+(state.run?'探索中は固定':'帰還済み')+'</span></div><div class="equipment">'+Object.keys(SLOTS).map(sl=>equipped(sl)?card(equipped(sl),' · 装備中'):'<div class="empty">'+SLOTS[sl]+'：未装備</div>').join('')+'</div><div class="spacer"></div><p class="small muted">'+esc(base(equipped('weapon')).skill)+' — '+esc(base(equipped('weapon')).desc)+'</p><div class="spacer"></div><button class="full ghost" data-action="inventory">装備を比較する →</button></div>'}
function status(){const s=buildStats(),r=state.run,hp=r?r.hp:s.hp;return '<div class="status"><div class="vitals '+(hp/s.hp<.3?'hp-low':'')+'"><div class="row"><span class="small">探索者 <span class="gold">Lv.'+state.level+'</span></span><span class="small">HP <b>'+hp+'</b> / '+s.hp+'</span></div><div class="bar"><div class="fill" style="width:'+clamp(hp/s.hp*100,0,100)+'%"></div></div><div class="small muted">'+(r?'集中 <span class="focus">'+'◆'.repeat(r.focus)+'◇'.repeat(3-r.focus)+'</span>':'次のLv.まで '+(xpNeed()-state.xp)+' EXP')+'</div></div><div class="stat">攻撃<strong>'+s.atk+'</strong></div><div class="stat">防御<strong>'+s.def+'</strong></div><div class="stat">会心<strong>'+s.crit+'<small>%</small></strong></div><div class="stat extra-stat">持帰装備<strong>'+state.inventory.length+'</strong></div></div>'}
function home(){return '<div class="panel">'+scene()+'<div class="pad"><div class="section-title"><div><div class="eyebrow">SANCTUARY</div><h2>灯守の拠点</h2></div><span class="badge">HP全回復</span></div><p class="story">崩れた鐘楼の下に、忘れられた迷宮がある。<br>持ち帰るのは財宝か、次へ踏み込むための一振りか。</p><div class="outcome small">'+esc(state.last)+'</div><div class="section-title"><h3>探索する深度</h3><span class="small muted">各6部屋 · 目安3〜6分</span></div><div class="rankcards">'+[1,2,3].map(n=>'<button data-rank="'+n+'" class="'+(state.selectedRank===n?'chosen':'')+'" '+(n>state.unlocked?'disabled':'')+'>深度 '+['I','II','III'][n-1]+'<br><small>'+(['灰の回廊','沈黙の礼拝堂','鐘底の墓所'][n-1])+'</small>'+(n>state.unlocked?'<br><small>前の監守を倒す</small>':'')+'</button>').join('')+'</div><button data-action="start" class="primary full">迷宮へ降りる <span aria-hidden="true">↓</span></button><p class="small muted" style="margin-top:12px">装備・レベルは永続。敗北で失うのは未帰還の拾得装備だけ。<br>探索ごとに回復薬3本を支給します。</p></div></div>'}
function pathScreen(){const r=state.run;const choices={hunt:{name:'物音のする廊下',hint:'通常戦闘 / 勝利で装備1個'},cache:{name:'封じられた小部屋',hint:'装備1個 / 30%で待ち伏せ戦闘'},rest:{name:'残り火の祭壇',hint:'HPを35%回復 / 戦闘なし'},elite:{name:'血痕の続く階段',hint:'強敵 / 魔法以上の装備1個'}};return '<div class="panel">'+scene()+'<div class="pad"><div class="eyebrow">EXPEDITION · DEPTH '+r.rank+'</div><div class="section-title"><h2>'+(r.room===5?'監守の扉':'分かれ道')+'</h2><span class="badge">'+r.room+' / 6 部屋</span></div>'+trail()+'<p class="story">'+(r.room===5?'重い扉の向こうから、鐘を引きずる音がする。挑むか、拾得品を持って引き返すか。':esc(r.event))+'</p><div class="actions">'+(r.room===5?'<button class="primary" data-path="boss"><b>監守に挑む</b><small>希少装備1個＋追加1個</small></button>':r.choices.map(c=>'<button data-path="'+c+'"><b>'+choices[c].name+'</b><small>'+choices[c].hint+'</small></button>').join(''))+'</div><div class="spacer"></div>'+travelActions()+'<div class="log">'+r.logs.slice(0,5).map(t=>'<p>'+esc(t)+'</p>').join('')+'</div></div></div>'}
function trail(){return '<div class="trail" aria-label="6部屋中'+state.run.room+'部屋探索">'+Array.from({length:6},(_,i)=>'<i class="'+(i<state.run.room?'done':'')+'"></i>').join('')+'</div>'}
function travelActions(){const r=state.run;return '<div class="actions"><button data-action="potion" '+(r.potions===0||r.hp>=buildStats().hp?'disabled':'')+'><b>回復薬 '+r.potions+'/3</b><small>最大HPの45%を回復</small></button><button data-action="return"><b>拠点へ帰還</b><small>拾得装備 '+r.loot.length+'個を確保</small></button></div>'}
function currentMove(){const r=state.run;return ENEMIES.find(e=>e.id===r.enemy.id).moves[r.turn%ENEMIES.find(e=>e.id===r.enemy.id).moves.length]}
function battleScreen(){const r=state.run,e=r.enemy,def=ENEMIES.find(x=>x.id===e.id),move=MOVES[currentMove()],w=base(equipped('weapon'));return '<div class="panel">'+scene(def)+'<div class="pad"><div class="row"><div class="eyebrow">BATTLE · ROOM '+r.room+'/6</div><span class="badge">ターン '+(r.turn+1)+'</span></div><h2 class="serif">'+(e.elite?'凶化した ':'')+def.name+'</h2><div class="row small"><span class="muted">'+(e.id==='warden'?'監守':'敵')+' / 防御 '+Math.max(0,e.def-(r.broken?3:0))+'</span><span>HP '+e.hp+' / '+e.max+'</span></div><div class="bar"><div class="fill enemy" style="width:'+e.hp/e.max*100+'%"></div></div><div class="intent"><div class="row"><span class="small">敵の次の行動</span><strong>'+move.name+'</strong></div><div class="small muted">'+move.hint+'</div></div><div class="actions"><button data-combat="attack"><b>攻撃</b><small>通常攻撃 / 集中 +1</small></button><button data-combat="skill" '+(r.focus<2?'disabled':'')+' class="primary"><b>'+w.skill+'</b><small>集中 −2 / '+(w.id==='dagger'?'会心を狙う2連撃':w.id==='sword'?'防御を崩す一撃':'後手・防御無視の重撃')+'</small></button><button data-combat="guard"><b>防御</b><small>被ダメージ70%減 / 集中 +1</small></button><button data-combat="potion" '+(r.potions===0||r.hp>=buildStats().hp?'disabled':'')+'><b>回復薬 '+r.potions+'/3</b><small>HP45%回復 / 敵は行動する</small></button></div><div class="row" style="margin-top:12px"><span class="small muted">拾得品 '+r.loot.length+'個 · 未確保</span><button class="ghost small" data-action="flee">撤退</button></div><div class="log" aria-live="polite">'+r.logs.slice(0,7).map(t=>'<p>'+esc(t)+'</p>').join('')+'</div><details class="small muted" style="margin-top:12px"><summary>敵・武器の特徴</summary><p>'+def.desc+'</p><p>'+w.desc+'</p></details></div></div>'}
function lootScreen(){const r=state.run,clear=r.phase==='cleared';return '<div class="panel">'+scene()+'<div class="pad"><div class="eyebrow">'+(clear?'DEPTH CLEARED':'DISCOVERY')+'</div><h2>'+(clear?'鐘は、静かになった。':'暗がりに残されたもの')+'</h2><p class="story">'+esc(r.event)+'</p><div class="equipment">'+r.latest.map(id=>card(r.loot.find(i=>i.id===id),' · 未帰還')).join('')+'</div><p class="small muted" style="margin-top:12px">装備をタップして比較。拠点に帰還すると装備できます。</p><div class="spacer"></div>'+(clear?'<button data-action="return" class="primary full">全ての拾得品を持って帰還 →</button>':'<button data-action="continue" class="primary full">探索を続ける →</button><div class="spacer"></div>'+travelActions())+'</div></div>'}
function inventoryScreen(){const r=state.run,source=bagView==='loot'&&r?r.loot:state.inventory;let list=source.filter(i=>filter==='all'||base(i).slot===filter).slice().reverse();page=clamp(page,0,Math.max(0,Math.ceil(list.length/10)-1));return '<div class="panel pad"><div class="section-title"><div><div class="eyebrow">EQUIPMENT & COLLECTION</div><h2>装備庫</h2></div><span class="badge">'+source.length+'個</span></div><p class="small muted">'+(r?'探索中は比較のみ。帰還してから装備変更できます。':'装備を選んで、現在の装備と比較してください。')+'</p><div class="spacer"></div>'+(r?'<div class="switchbar"><button data-bag="stored" class="'+(bagView==='stored'?'chosen':'')+'">持帰装備 '+state.inventory.length+'</button><button data-bag="loot" class="'+(bagView==='loot'?'chosen':'')+'">未帰還 '+r.loot.length+'</button></div>':'')+'<div class="inventory-tools"><select id="filter" aria-label="装備の種類"><option value="all">すべての装備</option>'+Object.entries(SLOTS).map(([k,v])=>'<option value="'+k+'" '+(filter===k?'selected':'')+'>'+v+'</option>').join('')+'</select><span class="small muted" style="align-self:center">新しく手に入れた順</span></div><div class="inventory-list">'+(list.length?list.slice(page*10,page*10+10).map(i=>card(i,Object.values(state.equipped).includes(i.id)?' · 装備中':'')).join(''):'<div class="empty">ここには、まだ装備がありません。</div>')+'</div><div class="listfooter"><button data-page="-1" '+(!page?'disabled':'')+'>←</button><span class="small muted">'+(page+1)+' / '+Math.max(1,Math.ceil(list.length/10))+'</span><button data-page="1" '+((page+1)*10>=list.length?'disabled':'')+'>→</button></div></div>'}
function render(){const s=buildStats();if(state.run)state.run.hp=Math.min(state.run.hp,s.hp);$('#warning').innerHTML=storageIssue?'<div class="notice">'+esc(storageIssue)+'</div>':'';$('#status').innerHTML=status();let content=tab==='inventory'?inventoryScreen():!state.run?home():state.run.phase==='battle'?battleScreen():state.run.phase==='path'?pathScreen():lootScreen();$('#app').innerHTML='<div class="layout"><section>'+content+'</section><aside>'+equipmentPanel()+'</aside></div>';$('#nav').innerHTML='<button data-tab="play" class="'+(tab==='play'?'selected':'')+'">'+(state.run?'探索・戦闘':'拠点・探索')+'</button><button data-tab="inventory" class="'+(tab==='inventory'?'selected':'')+'">装備庫'+(state.run?' / 未帰還 '+state.run.loot.length:' '+state.inventory.length)+'</button><button data-action="help">遊び方・仕様</button>'}
function modal(title,html){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();$('#modal').scrollTop=0}
function closeModal(){$('#modal').close()}
function detailCol(i,label){return '<div><div class="small muted">'+label+'</div><div class="spacer"></div>'+(i?icon(base(i).slot)+'<div class="item-name r'+i.rarity+'">'+esc(itemName(i))+'</div><div class="item-meta">'+RARITIES[i.rarity]+' / 深度'+i.tier+' / 品質'+i.quality+'%</div><table>'+[['atk','攻撃'],['def','防御'],['hp','HP'],['crit','会心']].map(([k,n])=>'<tr><td>'+n+'</td><td>'+i[k]+(k==='crit'?'%':'')+'</td></tr>').join('')+'</table>'+i.aff.map(a=>'<p class="affix-line">'+AFFIXES.find(x=>x.id===a).text+'</p>').join(''):'<p class="muted">未装備</p>')+'</div>'}
function compareItem(id){let i=[...state.inventory,...(state.run?state.run.loot:[])].find(x=>x.id===id);if(!i)return;let now=equipped(base(i).slot),isEquipped=now&&now.id===i.id,stored=state.inventory.includes(i),before=buildStats(),after=buildStats(i);modal('装備の比較','<div class="small muted">'+SLOTS[base(i).slot]+' / '+(stored?'持帰装備':'未帰還の拾得品')+'</div><div class="compare">'+detailCol(now,'現在の装備')+detailCol(i,'選択した装備')+'</div><h3>変更後の探索者</h3><div class="small" style="margin-top:8px">'+[['atk','攻撃'],['def','防御'],['hp','最大HP'],['crit','会心']].map(([k,n])=>{let d=after[k]-before[k];return n+' '+after[k]+(k==='crit'?'%':'')+' <span class="'+(d>0?'positive':d<0?'negative':'muted')+'">('+(d>0?'+':'')+d+')</span>'}).join(' / ')+'</div><div class="outcome small" style="margin-top:12px">'+esc(base(i).desc)+(base(i).slot==='weapon'?'<br>武器技：'+base(i).skill+'（集中2）':'')+'</div><div class="modal-actions"><button class="primary" data-equip="'+i.id+'" '+(state.run||isEquipped||!stored?'disabled':'')+'>'+(isEquipped?'装備中':state.run?'帰還後に装備できます':'この装備に変更する')+'</button>'+(stored?'<button data-lock="'+i.id+'">'+(i.locked?'保護を解除する':'誤廃棄しないよう保護する')+'</button><button class="danger ghost" data-discard="'+i.id+'" '+(isEquipped||i.locked||state.run?'disabled':'')+'>この装備を廃棄する</button>':'')+'</div>')}
function xpNeed(){return 26+(state.level-1)*17}
function addXP(n){state.xp+=n;while(state.xp>=xpNeed()&&state.level<999){state.xp-=xpNeed();state.level++;state.run.hp+=6;log('Lv.'+state.level+'に成長。最大HP+6、攻撃+1。')}state.xp=Math.min(state.xp,xpNeed()-1)}
function startRun(){if(state.run)return;state.run={rank:state.selectedRank,room:0,phase:'path',hp:buildStats().hp,focus:2,potions:3,loot:[],logs:['回復薬3本を携え、迷宮に降りた。'],event:'二つの通路に、異なる気配がある。行き先を選ぼう。',choices:['hunt','cache'],latest:[],enemy:null,turn:0,first:true,broken:0};tab='play';commit()}
function nextChoices(){let a=pick(['hunt','cache']),b=pick(['rest','elite']);state.run.choices=Math.random()<.5?[a,b]:[b,a]}
function beginEnemy(elite=false,boss=false){const r=state.run,b=boss?ENEMIES[4]:r.room===1?ENEMIES[0]:pick(ENEMIES.slice(0,4)),scale=(1+(r.rank-1)*.40)*(elite?1.3:1);r.enemy={id:b.id,hp:Math.round(b.hp*scale),max:Math.round(b.hp*scale),atk:Math.round(b.atk*scale),def:Math.round(b.def*(1+(r.rank-1)*.25)),xp:Math.round(b.xp*scale),elite};r.phase='battle';r.turn=0;r.broken=0;r.first=true;r.focus=Math.max(2,r.focus);log(b.name+'が行く手を塞いだ。')}
function choosePath(c){const r=state.run;if(!r||r.phase!=='path'||!(r.room===5?c==='boss':r.choices.includes(c)))return;r.room++;r.latest=[];if(c==='boss'||c==='hunt'||c==='elite'){beginEnemy(c==='elite',c==='boss')}else if(c==='cache'&&Math.random()<.3){log('小部屋に潜んでいた敵の待ち伏せだ！');beginEnemy()}else if(c==='cache'){let i=makeItem(r.rank);r.loot.push(i);r.latest=[i.id];r.phase='loot';r.event='封印の解けた箱から、古い装備を見つけた。';log('宝箱：'+itemName(i))}else{let old=r.hp;r.hp=Math.min(buildStats().hp,r.hp+Math.ceil(buildStats().hp*.35));r.phase='loot';r.event='残り火に手をかざし、HPを'+(r.hp-old)+'回復した。';log(r.event)}commit()}
function continueRun(){const r=state.run;if(!r||r.phase!=='loot')return;r.phase='path';r.event='足音が、湿った石壁に反響する。さらに奥へ進むか、今あるものを持ち帰るか。';nextChoices();commit()}
function heal(n){const r=state.run,old=r.hp;r.hp=Math.min(buildStats().hp,r.hp+n);return r.hp-old}
function potion(){const r=state.run;if(!r||r.potions<1||r.hp>=buildStats().hp)return;if(r.phase==='battle'){combat('potion');return}r.potions--;log('回復薬でHPを'+heal(Math.ceil(buildStats().hp*.45))+'回復。');commit()}
function enemyAttack(guard=false){const r=state.run,e=r.enemy,m=currentMove(),s=buildStats(),move=MOVES[m];if(!move.mult){log(m==='guard'?'敵は身を固めている。':'敵は体勢を崩している。');return}let total=0;for(let j=0;j<(m==='double'?2:1);j++){let damage=Math.max(1,Math.round(e.atk*move.mult)-s.def);if(guard)damage=Math.max(1,Math.ceil(damage*.3));total+=damage}r.hp=Math.max(0,r.hp-total);log(move.name+'：'+total+'ダメージ'+(guard?'（防御）':'')+'。');if(m==='drain'){let v=Math.min(total,e.max-e.hp);e.hp+=v;log('敵がHPを'+v+'吸収。')}if(guard&&r.hp>0&&s.aff.thorn){let v=5*s.aff.thorn;e.hp=Math.max(0,e.hp-v);log('反撃：敵に'+v+'ダメージ。')}}
function playerAttack(skill){const r=state.run,e=r.enemy,s=buildStats(),w=base(equipped('weapon')),move=currentMove();if(skill&&w.id==='sword')r.broken=3;const hits=skill&&w.id==='dagger'?2:1,first=r.first;let sum=0,crits=0;for(let h=0;h<hits;h++){let mult=skill?(w.id==='dagger'?.8:w.id==='hammer'?2:1.5):1;mult*=skill?1+.25*(s.aff.echo||0):1;mult*=first?1+.4*(s.aff.rush||0):1;let crit=Math.random()<s.crit/100;if(crit){mult*=1.7;crits++}let def=Math.max(0,e.def-(r.broken?3:0)-3*(s.aff.pierce||0)-(skill&&w.id==='dagger'?1:0));if(skill&&w.id==='hammer')def=0;let damage=Math.max(1,Math.round(s.atk*mult)-def);if(move==='guard'&&!(skill&&w.id==='hammer'))damage=Math.max(1,Math.round(damage*.5));if(move==='open')damage=Math.round(damage*1.3);sum+=damage;}e.hp=Math.max(0,e.hp-sum);r.first=false;log((skill?w.skill:'攻撃')+'：'+sum+'ダメージ'+(crits?' / 会心'+crits+'回！':'')+'。');if(crits&&s.aff.blood)log('吸血：HPを'+heal(4*crits*s.aff.blood)+'回復。')}
function combat(action){const r=state.run;if(!r||r.phase!=='battle'||!['attack','skill','guard','potion'].includes(action))return;if(action==='skill'&&r.focus<2||action==='potion'&&(r.potions<1||r.hp>=buildStats().hp))return;const late=action==='skill'&&base(equipped('weapon')).id==='hammer';if(action==='skill')r.focus-=2;else if(action==='attack'||action==='guard')r.focus=Math.min(3,r.focus+1);if(late){enemyAttack();if(r.hp<=0){defeat();return}playerAttack(true)}else{if(action==='guard'){const n=4*(buildStats().aff.mend||0);if(n)log('再起：HPを'+heal(n)+'回復。');log('身を守り、集中を整えた。')}else if(action==='potion'){r.potions--;log('回復薬：HPを'+heal(Math.ceil(buildStats().hp*.45))+'回復。')}else playerAttack(action==='skill');if(r.enemy.hp>0)enemyAttack(action==='guard')}if(r.hp<=0){defeat();return}if(r.enemy.hp<=0){victory();return}r.turn++;r.broken=Math.max(0,r.broken-1);commit()}
function victory(){const r=state.run,e=r.enemy,boss=e.id==='warden';state.stats.kills++;addXP(e.xp);log('勝利。経験値 '+e.xp+' を獲得。');let first=state.stats.kills===1;const found=[makeItem(r.rank,boss?2:e.elite||first?1:null,first?'dagger':null)];if(boss)found.push(makeItem(r.rank,1));r.loot.push(...found);r.latest=found.map(i=>i.id);r.phase=boss?'cleared':'loot';r.event=boss?'監守を倒した。希少装備と魔法装備を発見。次の深度への道が開いた。':'戦いの跡に、装備を見つけた。現在の装備と比較してみよう。';if(boss){state.stats.bosses++;state.unlocked=Math.max(state.unlocked,Math.min(3,r.rank+1));if(r.rank===3)r.event='最深部の監守を倒した。希少装備を持ち帰ろう。さらに良い個体を求め、同じ深度を再探索できる。'}r.enemy=null;commit()}
function returnHome(){const r=state.run;if(!r||r.phase==='battle')return;const count=r.loot.length;state.inventory.push(...r.loot);state.stats.returns++;state.last='深度'+r.rank+'・'+r.room+'部屋から帰還。装備'+count+'個を確保しました。装備庫で比較・変更できます。';state.history.unshift(state.last);state.history=state.history.slice(0,20);state.run=null;tab='play';bagView='stored';commit();notify(count+'個の装備を持ち帰りました')}
function defeat(){const r=state.run;state.last='深度'+r.rank+'で力尽きた。未帰還の装備'+r.loot.length+'個を失った。持帰装備とレベル・経験値は保持され、HPは全回復。';state.history.unshift(state.last);state.history=state.history.slice(0,20);state.run=null;tab='play';bagView='stored';commit();notify('灯守に救われ、拠点へ戻りました')}
function flee(){const r=state.run;if(!r||r.phase!=='battle')return;modal('戦闘から撤退','<p>敵の予告された行動を<strong>1回受けて</strong>帰還します。生き残れば拾得品はすべて確保できます。</p><p class="small muted" style="margin-top:10px">敵が「構え」「隙」のときはダメージなしで撤退できます。</p><div class="modal-actions"><button class="danger" data-action="confirm-flee">撤退する</button><button data-action="close">戦闘に戻る</button></div>')}
function doFlee(){closeModal();if(!state.run||state.run.phase!=='battle')return;enemyAttack(false);if(state.run.hp<=0)defeat();else{state.run.phase='path';state.run.enemy=null;returnHome()}}
function equip(id){if(state.run)return;const i=state.inventory.find(i=>i.id===id);if(!i)return;state.equipped[base(i).slot]=id;commit();compareItem(id);notify('装備を変更しました')}
function help(){modal('遊び方・試作仕様','<div class="help"><p><strong>装備を探し、持ち帰り、自分の戦い方を作る。</strong><br>自動戦闘なし・主人公1人の装備収集RPGです。</p><h3>まずは1回、持ち帰ろう</h3><ol><li>拠点の「迷宮へ降りる」で出発。</li><li>通路を選び、敵の次の行動を見てコマンドを選ぶ。</li><li>戦利品をタップし、装備中の品と比較。</li><li>HPが減ったら回復薬を使うか、早めに帰還。</li><li>「装備庫」で装備を変更して再探索。6部屋目の監守を倒すと次の深度へ。</li></ol><h3>手動コマンド戦闘</h3><p>通常は探索者が先手。攻撃・防御で集中+1（最大3）。武器技は集中2を消費。戦闘開始時は集中が最低2まで回復します。防御はそのターンの被ダメージを70%減らします。回復薬は最大HPの45%を回復し、探索ごとに3本補充。戦闘中に使うと敵も行動します。</p><table><tr><th>武器</th><th>武器技 / 使い分け</th></tr>'+BASES.filter(b=>b.slot==='weapon').map(b=>'<tr><td>'+b.name+'</td><td>'+b.skill+'：'+b.desc+'</td></tr>').join('')+'</table><p>基本ダメージ＝攻撃×技倍率−敵防御（最低1）。会心は攻撃側の威力1.7倍。敵の「構え」は被ダメージ半減、「隙」はこちらの与ダメージ1.3倍。槌の武器技だけは後手なので、敵の大振りに注意してください。</p><h3>装備の生成と比較</h3><p>基礎装備8種（武器3・防具2・装飾品3）。各装備の攻撃・防御・HPに品質85〜115%、深度補正（1 / 1.24 / 1.48）、レア補正（1 / 1.09 / 1.18）を掛けて丸めます。会心率は基礎装備ごとに固定。品質は同じ種類・深度・レアリティ同士を比べる目安です。</p><p>通常ドロップは通常約49%・魔法約39%・希少12%。追加効果は通常0、魔法1、希少2。1つの装備で同じ追加効果は重複しません。複数装備の同効果は加算。会心率上限70%。装備できる枠に合う効果だけが出現します。</p><table><tr><th>効果</th><th>性能</th></tr>'+AFFIXES.map(a=>'<tr><td>'+a.name+'</td><td>'+a.text+'</td></tr>').join('')+'</table><p>通常戦闘で必ず装備1個。最初の勝利は魔法の短剣、凶化した敵は魔法装備、監守は希少1個＋魔法1個を保証します。基礎種類と組み合わせを少数に絞り、比較しやすくしています。</p><h3>帰還・敗北（試作用の仮ルール）</h3><p>戦闘外ならいつでも帰還。装備変更は拠点のみ。敗北で失うのは、その探索で拾った未帰還の装備だけ。持帰装備、装備中の品、レベル、経験値、解放済み深度は保持します。戦闘中の撤退は敵の行動を1回受けて、生き残れば全品を持ち帰ります。</p><h3>記録と対応環境</h3><p>行動ごとにこのブラウザへ自動保存します。探索・戦闘の途中も再開できます。別端末・別URL・ブラウザデータの消去には引き継がれません。「記録」からセーブ書き出し・読み込みができます。保存不可時は画面上に表示します。外部通信・外部素材・ライブラリ不要の単一HTMLです。</p><p>iPhoneではSafari上のWebページとして開いてください。ファイルアプリやチャット内のHTMLプレビューではゲームが実行されない場合があります。その場合はこのHTMLをWebサーバー（GitHub Pages等）に配置し、SafariでURLを開きます。</p><h3>実装済み</h3><p>ランダム分岐、3深度×6部屋、敵5種＋凶化、手動戦闘、武器技3種、基礎装備8種、追加効果8種、レアリティ3段階、比較と装備変更、装備保護・個別廃棄、成長、帰還、敗北、自動保存・手動バックアップ。</p><h3>未実装・今後決めること</h3><p>固有ユニーク装備、職業・魔法・属性、複数人パーティ、自由移動マップ、制作・強化・売買、音楽、オンライン、アプリ配信・課金は未実装。</p><ul><li>レアな種類を探す楽しさと、同じ品の良個体を狙う楽しさの配分。</li><li>未帰還品ロスト・撤退条件が楽しい緊張感になっているか。</li><li>武器3種と効果8種に、選ぶ理由があるか。</li><li>ドロップ頻度、比較の負担、倉庫整理の必要性。</li></ul><p>まずは「拾って比較したくなるか」「装備を替えて再探索したくなるか」を確かめる版です。名称・世界設定・図形は本作向けのオリジナルです。</p></div>')}
function records(){modal('記録・セーブ','<div class="help"><p>討伐 '+state.stats.kills+'体 / 帰還 '+state.stats.returns+'回 / 監守 '+state.stats.bosses+'体</p><p class="small muted">'+(storageIssue?'自動保存：停止中':'自動保存：有効 · 行動ごとに保存')+'</p><div class="modal-actions"><button data-action="export" class="primary">セーブを書き出す（JSON）</button><button data-action="show-code">コピー用セーブを表示</button><label class="item">セーブファイルを読み込む<input id="importFile" type="file" accept=".json,application/json" style="display:block;margin-top:10px;width:100%"></label></div><h3>セーブを貼り付けて読み込む</h3><textarea id="saveText" placeholder="書き出したJSONを貼り付け" aria-label="セーブデータ"></textarea><button data-action="import-code" class="full">貼り付けたデータを確認</button>'+(storageIssue?'<div class="spacer"></div><button data-action="resume-save" class="full">現在の進行で保存を再開</button>':'')+'<h3>最近の帰還</h3>'+state.history.slice(0,4).map(x=>'<p>'+esc(x)+'</p>').join('')+'<h3>最初からやり直す</h3><p>全装備・成長を消去します。必要なら先に書き出してください。</p><button data-action="reset" class="danger full">データ初期化…</button></div>')}
function exportSave(){const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ashen-vault-save-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('セーブファイルを書き出しました')}
let pendingImport=null;
function importData(raw){try{if(raw.length>8000000)throw Error();const s=JSON.parse(raw);if(!valid(s))throw Error();pendingImport=s;modal('セーブを読み込みますか？','<p>Lv.'+s.level+' / 装備'+s.inventory.length+'個 / '+(s.run?'探索途中':'拠点')+' の記録です。現在の進行を置き換えます。</p><div class="modal-actions"><button data-action="confirm-import" class="primary">この記録を読み込む</button><button data-action="records">キャンセル</button></div>')}catch(e){notify('対応するセーブデータではありません。現在の進行は変更していません。')}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.tab){tab=d.tab;page=0;render();window.scrollTo(0,0)}else if(d.item)compareItem(d.item);else if(d.rank){if(!state.run&&+d.rank<=state.unlocked){state.selectedRank=+d.rank;commit()}}else if(d.path)choosePath(d.path);else if(d.combat)combat(d.combat);else if(d.equip)equip(d.equip);else if(d.lock){const i=state.inventory.find(x=>x.id===d.lock);if(i){i.locked=!i.locked;commit();compareItem(i.id)}}else if(d.discard){const i=state.inventory.find(x=>x.id===d.discard);if(i&&!i.locked&&!state.run&&!Object.values(state.equipped).includes(i.id))modal('装備を廃棄しますか？','<p>'+esc(itemName(i))+' を廃棄します。この操作は元に戻せません。</p><div class="modal-actions"><button class="danger" data-remove="'+i.id+'">廃棄する</button><button data-item="'+i.id+'">比較に戻る</button></div>')}else if(d.remove){const i=state.inventory.find(x=>x.id===d.remove);if(i&&!i.locked&&!state.run&&!Object.values(state.equipped).includes(i.id)){state.inventory=state.inventory.filter(x=>x.id!==i.id);closeModal();commit()}}else if(d.page){page+=+d.page;render()}else if(d.bag){bagView=d.bag;page=0;render()}else if(d.action){switch(d.action){case'start':startRun();break;case'continue':continueRun();break;case'return':returnHome();break;case'potion':potion();break;case'flee':flee();break;case'confirm-flee':doFlee();break;case'close':closeModal();break;case'inventory':tab='inventory';page=0;render();break;case'help':help();break;case'records':records();break;case'export':exportSave();break;case'show-code':$('#saveText').value=JSON.stringify(state);$('#saveText').select();notify('表示したデータをコピーして保存できます');break;case'import-code':importData($('#saveText').value);break;case'confirm-import':if(pendingImport){state=pendingImport;pendingImport=null;storageIssue='';tab='play';bagView='stored';closeModal();commit();notify('セーブを読み込みました')}break;case'resume-save':modal('自動保存を再開','<p>読み込めなかった旧データがある場合、現在の進行で上書きされます。</p><div class="modal-actions"><button data-action="confirm-resume" class="primary">現在の進行を保存する</button><button data-action="records">戻る</button></div>');break;case'confirm-resume':storageIssue='';commit();records();break;case'reset':modal('全データを初期化しますか？','<p>装備・レベル・探索記録をすべて消去し、新しい探索者で始めます。</p><div class="modal-actions"><button class="danger" data-action="confirm-reset">全データを消して開始</button><button data-action="records">キャンセル</button></div>');break;case'confirm-reset':state=initial();storageIssue='';tab='play';bagView='stored';closeModal();commit();break;}}});
document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;page=0;render()}if(e.target.id==='importFile'){const f=e.target.files[0];if(f){if(f.size>8000000){notify('セーブファイルが大きすぎます');return}const reader=new FileReader();reader.onload=()=>importData(reader.result);reader.onerror=()=>notify('ファイルを読み込めませんでした');reader.readAsText(f)}}});
$('#helpBtn').onclick=help;$('#saveBtn').onclick=records;$('#closeModal').onclick=closeModal;$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal()}});
render();
</script></body></html>
